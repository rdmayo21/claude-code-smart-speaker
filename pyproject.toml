[project]
name = "claude-code-smart-speaker"
version = "0.1.0"
description = "A smart speaker powered by Claude Code: Home Assistant Voice PE firmware and its bridge"
requires-python = ">=3.11"
dependencies = ["websockets>=14"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
